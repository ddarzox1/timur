services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qauipsiz
      # На сервере задайте POSTGRES_PASSWORD в .env рядом с compose-файлом.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qauipsiz}
      POSTGRES_DB: qauipsiz
    # Только localhost: для go run / go test с этой машины, снаружи база недоступна.
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qauipsiz"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://qauipsiz:${POSTGRES_PASSWORD:-qauipsiz}@db:5432/qauipsiz?sslmode=disable
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # Локальная разработка: демо-данные и вход по коду 1111. На проде — SEED=0 и FIXED_OTP пустой.
      SEED: ${SEED:-1}
      FIXED_OTP: ${FIXED_OTP:-1111}
    volumes: [uploads:/app/uploads]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
