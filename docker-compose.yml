services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qauipsiz
      # На сервере задайте POSTGRES_PASSWORD в .env рядом с compose-файлом.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qauipsiz}
      POSTGRES_DB: qauipsiz
    # Только localhost: для go run / go test с этой машины, снаружи база недоступна.
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qauipsiz"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://qauipsiz:${POSTGRES_PASSWORD:-qauipsiz}@db:5432/qauipsiz?sslmode=disable
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # Локальная разработка: демо-данные и вход по коду 1111. На проде — SEED=0 и FIXED_OTP пустой.
      SEED: ${SEED:-1}
      FIXED_OTP: ${FIXED_OTP:-1111}
      # Хранилище файлов: local (том uploads) или s3 (внешний S3; локальный S3 из профиля s3 — только через make up-s3).
      STORAGE: ${STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-1}  # 0 — http
    volumes: [uploads:/app/uploads]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  # Локальный S3 для разработки (SeaweedFS): make up-s3. Ключи — в dev/s3.json, совпадают с .env.example.
  s3:
    profiles: [s3]
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=128
    ports: ["127.0.0.1:9000:8333"]
    volumes:
      - s3data:/data
      - ./dev/s3.json:/etc/seaweedfs/s3.json:ro

  s3-init: # создаёт бакет и выходит
    profiles: [s3]
    image: chrislusf/seaweedfs:3.97
    depends_on: [s3]
    entrypoint: >
      sh -c "for i in $$(seq 60); do
               echo 's3.bucket.create -name ${S3_BUCKET:-qauipsiz}' | weed shell -master=s3:9333 2>&1 | grep -qiE 'created|exist' && exit 0;
               sleep 1; done; echo 'не удалось создать бакет'; exit 1"

volumes:
  pgdata:
  uploads:
  s3data:
