{{define "page"}}{{template "public" .}}{{end}}
{{define "title"}}{{t "Вход"}} — Qauipsiz{{end}}
{{define "content"}}
<div class="auth-box">
  <div class="row between" style="margin-bottom:1.5rem">
    <a href="/" class="logo" style="padding:0"><span class="logo-mark">{{template "i" "shield"}}</span><span class="logo-t">Qauipsiz</span></a>
    <span class="row">{{template "themeToggle" .}}{{template "langswitch" .}}</span>
  </div>
  <form method="post" action="/login">
    <h1>{{t "Вход"}}</h1>
    {{with .Error}}<div class="error">{{t .}}</div>{{end}}
    <div class="field"><label for="iin">{{t "ИИН"}}</label><input id="iin" name="iin" value="{{.IIN}}" inputmode="numeric" autocomplete="username" minlength="12" maxlength="12" pattern="[0-9]{12}" placeholder="12 цифр" required autofocus></div>
    <div class="field"><label for="password">{{t "Пароль"}}</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn accent big" type="submit">{{t "Войти"}}</button>
  </form>
</div>
{{end}}
